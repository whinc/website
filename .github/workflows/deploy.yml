name: deploy

on:
  push:
    branches: [main]
    # 只在这些路径变化时部署；文档、README、.claude/ 的改动不触发
    paths:
      - site/**
      - scripts/gate.mjs
      - .github/workflows/deploy.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 站点产物门禁
        run: node scripts/gate.mjs

  deploy-cloudbase:
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 安装 CloudBase CLI
        run: npm i -g @cloudbase/cli@3.8.9
      - name: 登录
        env:
          TCB_SECRET_ID: ${{ secrets.TCB_SECRET_ID }}
          TCB_SECRET_KEY: ${{ secrets.TCB_SECRET_KEY }}
        run: tcb login --apiKeyId "$TCB_SECRET_ID" --apiKey "$TCB_SECRET_KEY"
      - name: 静态托管信息
        run: tcb hosting detail -e ucalc-8gcrvzxk48dd172e
      - name: 部署静态托管
        run: tcb hosting deploy ./site -e ucalc-8gcrvzxk48dd172e --retry-count 2

  deploy-pages:
    needs: gate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: 组装 Pages 产物（排除 404.html）
        run: |
          mkdir -p _pages
          rsync -a --exclude 404.html site/ _pages/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _pages
      - id: deployment
        uses: actions/deploy-pages@v4
